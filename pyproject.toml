[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-transfer-station"
version = "0.1.0"
description = "General-purpose library for control of transfer stations for 2D materials research"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "flask",
    "flask-cors",
    "websockets",
    "pyserial",
    "python-dotenv",
    "matplotlib",
    "numpy<2.2",
    "scipy",
    "pydantic>=2.0",
    "aiortc>=1.9",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
omero = ["omero-py"]
thor = []  # ThorLabs SDK installed separately
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[project.scripts]
ats = "ats.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
ats = ["cameras/thor_drivers/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

